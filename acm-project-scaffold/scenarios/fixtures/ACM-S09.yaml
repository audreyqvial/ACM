scenario_id: ACM-S09
priority: P0
frameworks: [core]
description: >
  Preuve complète mais résultat bloquant en échec. Une preuve couvre toutes les
  dimensions exigées (donc assessed) mais son résultat est fail+blocking (donc
  quality nok). Démontre formellement que `assessed` ≠ `passed` : l'assurance
  mesure la COUVERTURE, la qualité mesure le RÉSULTAT.

context:
  eligibility_context: validation
  environment: local
  now: "2026-07-27T10:00:00Z"

revisions:
  - id: aci:agent:planner
    revision_id: R1
    aci_type: agent
    lifecycle_state: validated
    quality_state: ok
    assurance_state: assessed
    assurance_policy: {required_assurance_dimensions: [functional], composition_mode: direct_only}

relations: []

evidence:
  # Couvre 'functional' (→ assessed) MAIS échoue en bloquant (→ nok).
  - id: evidence:eval:planner:001
    target: aci:agent:planner
    scope_dimensions: [functional]
    result: fail
    blocking: true

expected:
  items:
    aci:agent:planner:
      effective_assurance: assessed   # couverture complète
      effective_quality: nok          # mais le test échoue
      eligibility_state: blocked
