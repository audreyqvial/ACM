# Emplacement : scenarios/fixtures/ACM-S05.yaml
scenario_id: ACM-S05
priority: P0
frameworks: [core, langgraph, crewai]
description: >
  Dépendance bloquante avec qualité NOK. T1 (tool) est nok ; A1 l'utilise via
  une relation required+blocking. L'effective_quality de A1 devient nok et A1/W1
  sont bloqués — MAIS la qualité intrinsèque déclarée de A1/W1 reste inchangée
  (séparation état déclaré / état calculé). Le lifecycle de A1/W1 n'est pas
  copié depuis T1.

context:
  eligibility_context: validation
  environment: local
  now: "2026-07-27T10:00:00Z"

revisions:
  - id: aci:tool:web-search
    revision_id: R1
    aci_type: tool
    lifecycle_state: validated
    quality_state: nok            # T1 intrinsèquement nok
    assurance_state: assessed
    assurance_policy: {required_assurance_dimensions: [functional], composition_mode: hybrid}
  - id: aci:agent:planner
    revision_id: R1
    aci_type: agent
    lifecycle_state: validated
    quality_state: ok             # A1 intrinsèquement ok — NE DOIT PAS changer
    assurance_state: assessed
    assurance_policy: {required_assurance_dimensions: [functional], composition_mode: hybrid}
  - id: aci:workflow:report-pipeline
    revision_id: R1
    aci_type: workflow
    lifecycle_state: validated
    quality_state: ok
    assurance_state: assessed
    assurance_policy: {required_assurance_dimensions: [functional], composition_mode: hybrid}

relations:
  - id: rel:a1:uses-tool:t1
    source: aci:agent:planner
    target: aci:tool:web-search
    relation_type: uses_tool
    required: true
    propagation_policy: blocking
  - id: rel:w1:contains:a1
    source: aci:workflow:report-pipeline
    target: aci:agent:planner
    relation_type: contains
    required: true
    propagation_policy: blocking

evidence:
  - id: evidence:eval:tool:001
    target: aci:tool:web-search
    scope_dimensions: [functional]
    result: pass
    blocking: true
  - id: evidence:eval:planner:001
    target: aci:agent:planner
    scope_dimensions: [functional]
    result: pass
    blocking: true
  - id: evidence:eval:workflow:001
    target: aci:workflow:report-pipeline
    scope_dimensions: [functional]
    result: pass
    blocking: true

expected:
  items:
    aci:tool:web-search:
      effective_quality: nok
      eligibility_state: blocked
    aci:agent:planner:
      declared_quality: ok           # intrinsèque préservé
      effective_quality: nok         # propagé via blocking
      eligibility_state: blocked
      lifecycle_state: validated     # NON copié depuis T1
    aci:workflow:report-pipeline:
      declared_quality: ok
      effective_quality: nok
      eligibility_state: blocked
      lifecycle_state: validated
