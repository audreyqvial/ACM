# Emplacement : scenarios/fixtures/ACM-S10.yaml
scenario_id: ACM-S10
priority: P0
frameworks: [core]
description: >
  Modes d'assurance de composition (direct_only / aggregate_only / hybrid).
  Cette fixture teste le cas C, le plus discriminant : mode hybrid, preuve
  directe complète MAIS une dépendance non assessed → le composite N'EST PAS
  assessed (partially_assessed). Les cas A (direct_only→assessed),
  B (aggregate_only→assessed) et D (anti-vacuité→unassessed) sont dans le test
  dédié tests/test_scenario_s10.py.

context:
  eligibility_context: validation
  environment: local
  now: "2026-07-27T10:00:00Z"

revisions:
  - id: aci:workflow:report-pipeline
    revision_id: R1
    aci_type: workflow
    lifecycle_state: validated
    quality_state: ok
    assurance_state: assessed
    assurance_policy:
      required_assurance_dimensions: [functional]
      composition_mode: hybrid
  # Dépendance NON assessed (draft/unknown/unassessed).
  - id: aci:agent:planner
    revision_id: R1
    aci_type: agent
    lifecycle_state: draft
    quality_state: unknown
    assurance_state: unassessed

relations:
  - id: rel:w1:contains:a1
    source: aci:workflow:report-pipeline
    target: aci:agent:planner
    relation_type: contains
    required: true
    propagation_policy: blocking

evidence:
  # Preuve directe COMPLÈTE sur le workflow (couvre functional).
  - id: evidence:eval:workflow:001
    target: aci:workflow:report-pipeline
    scope_dimensions: [functional]
    result: pass
    blocking: true

expected:
  items:
    aci:workflow:report-pipeline:
      # hybrid : preuve directe complète NE SUFFIT PAS si une dep n'est pas assessed
      effective_assurance: partially_assessed
