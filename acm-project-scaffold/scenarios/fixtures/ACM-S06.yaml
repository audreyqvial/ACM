# Emplacement : scenarios/fixtures/ACM-S06.yaml
scenario_id: ACM-S06
priority: P1
frameworks: [core]
description: >
  Dépendance non bloquante avec qualité NOK. A1 utilise T1 (nok) via une
  relation optionnelle (required=false, propagation_policy=warning).
  L'effective_quality de A1 n'est PAS forcée à nok du seul fait de T1, mais son
  éligibilité passe en warning, avec une raison structurée référençant la
  relation.

context:
  eligibility_context: validation
  environment: local
  now: "2026-07-27T10:00:00Z"

revisions:
  - id: aci:tool:web-search
    revision_id: R1
    aci_type: tool
    lifecycle_state: validated
    quality_state: nok
    assurance_state: assessed
    assurance_policy: {required_assurance_dimensions: [functional], composition_mode: hybrid}
  - id: aci:agent:planner
    revision_id: R1
    aci_type: agent
    lifecycle_state: validated
    quality_state: ok
    assurance_state: assessed
    assurance_policy: {required_assurance_dimensions: [functional], composition_mode: hybrid}

relations:
  - id: rel:a1:uses-tool:t1
    source: aci:agent:planner
    target: aci:tool:web-search
    relation_type: uses_tool
    required: false
    propagation_policy: warning

evidence:
  - id: evidence:eval:tool:001
    target: aci:tool:web-search
    scope_dimensions: [functional]
    result: pass
    blocking: true
  - id: evidence:eval:planner:001
    target: aci:agent:planner
    scope_dimensions: [functional]
    result: pass
    blocking: true

expected:
  items:
    aci:agent:planner:
      effective_quality: ok          # PAS contaminé par T1 (relation warning)
      eligibility_state: warning
      reason_codes: [ACM-PROP-WARN]  # raison structurée présente
