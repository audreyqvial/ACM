scenario_id: ACM-S03
priority: P0
frameworks: [core]
description: >
  Identité exacte. Une preuve cible le bon revision_id mais un digest
  incorrect. Elle ne doit PAS être acceptée : evidence_applicability =
  inapplicable, l'assurance ne peut pas atteindre assessed, l'item est bloqué.

context:
  eligibility_context: validation
  environment: local
  now: "2026-07-27T10:00:00Z"

revisions:
  - id: aci:agent:planner
    revision_id: R1
    digest: "sha256:digest_correct"
    aci_type: agent
    lifecycle_state: validated
    quality_state: ok
    assurance_state: assessed
    content_frozen: true
    assurance_policy:
      required_assurance_dimensions: [functional]
      composition_mode: direct_only

relations: []

evidence:
  # La preuve vise le bon revision_id (R1) mais un digest FAUX.
  - id: evidence:eval:planner:001
    target: aci:agent:planner
    target_revision_id: R1
    target_digest: "sha256:digest_incorrect"
    scope_environment: local
    scope_dimensions: [functional]
    result: pass
    blocking: true

expected:
  items:
    aci:agent:planner:
      # Le digest divergent rend la preuve inapplicable ...
      inapplicable_evidence: [evidence:eval:planner:001]
      applicable_evidence: []
      # ... donc l'assurance effective ne peut pas être assessed ...
      effective_assurance: unassessed
      # ... et l'item est bloqué.
      eligibility_state: blocked
